<!DOCTYPE html>
<html xml:lang="es">
  <head>
    <title>Totalizador</title>
  </head>

  <body>
    <h1>Totalizador de venta</h1>

    <form id="totalizar-form">
      <div>
        <label for="cantidad">Cantidad de items:</label>
        <input type="number" id="cantidad" />
      </div>

      <div>
        <label for="precio">Precio por item:</label>
        <input type="number" id="precio" />
      </div>

      <div>
      <label for="estado">Código de estado:</label>
      <select id="estado"></select>
      </div>

    <div>
    <input type="submit" value="Totalizar" id="totalizar-button" />
    <button type="button" id="cancelar-button">Cancelar compra</button>
    </div>
    </form>

    <div id="resultado-div"></div>

    <script type="module" src="./src/presenter.js"></script>
  </body>
</html>
